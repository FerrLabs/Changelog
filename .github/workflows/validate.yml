name: Validate entries

on:
  push:
    branches: [main]
    paths: ['entries/**', 'scripts/validate-entries.mjs', '.github/workflows/validate.yml']
  pull_request:
    paths: ['entries/**', 'scripts/validate-entries.mjs', '.github/workflows/validate.yml']

permissions:
  contents: read

jobs:
  validate:
    name: Validate entry frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Validate entries/*.md frontmatter
        run: node scripts/validate-entries.mjs
