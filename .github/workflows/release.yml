name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write  # required for the FerrFlow bot identity (OIDC)

jobs:
  release:
    name: ferrflow release
    runs-on: ferrlabs-k8s
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ferrflow release
        uses: FerrLabs/FerrFlow@v5
        with:
          mode: release
          bot: true
